
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход — Zanevka Newsbot</title>
  <link rel="icon" href="index_files/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="index_files/style.css">
  <link rel="stylesheet" href="index_files/themes.css">
  <link rel="stylesheet" href="index_files/login.css">
</head>
<body class="login-page">
  <main class="app login-app">
    <form id="login-form" class="settings-body login-form">
    

      <div class="login-row">
        <label class="field">
          <span class="field-label">Логин</span>
          <input name="username" autocomplete="username" required autofocus>
        </label>

        <label class="field">
          <span class="field-label">Пароль</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>

        <button class="save-button" type="submit" disabled>Войти</button>
      </div>

      <p id="login-error" role="status" aria-live="polite"></p>
    </form>
    <aside class="settings-body log-panel" aria-label="Последние десять журналов Newsbot">
      <div class="log-head">
        <button id="refresh-log" type="button" class="refresh-button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
          Обновить
        </button>
      </div>
      <div id="preview-records" class="log-scroll" role="region" aria-label="Текст журнала" tabindex="0"></div>
      <div class="resize-edge" role="separator" tabindex="0" aria-controls="preview-records"
           aria-orientation="horizontal" aria-label="Высота журнала" aria-valuenow="300"></div>
      <div class="resize-left" role="separator" tabindex="0" aria-controls="preview-records"
           aria-orientation="vertical" aria-label="Ширина журнала" aria-valuenow="380"></div>
      <div class="resize-corner" aria-hidden="true"></div>
    </aside>
  </main>
  <script src="index_files/login.js"></script>
  <script src="index_files/login-preview.js"></script>
</body>
</html>
